[tool.poetry]
name = "ai-pair-programmer"
version = "0.1.0"
description = "AI Pair-Programmer with Memory that learns coding habits"
authors = ["AI Assistant"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12.0"
pydantic = "^2.8.0"
openai = "^1.35.0"
gitpython = "^3.1.43"
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"